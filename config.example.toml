[profile]
# 主视觉卡片上的大标题，通常写你的名字
title = "Your Name"
subtitle = "Long-term Claude Code + Codex activity, collected locally"
timezone = "Asia/Shanghai"
window_days = 365
# 用于生成 README 里的 raw 图片地址；留空则退回仓库内相对路径
repo = "your-name/your-name"
branch = "main"

[paths]
claude_glob = "~/.claude/projects/**/*.jsonl"
codex_homes = [
  "~/.codex",
  "~/.local/state/agent-config/codex/*",
]
cache_db = "data/profile.sqlite"
daily_ledger = "data/daily.jsonl"
output_dir = "dist"
readme = "README.md"
