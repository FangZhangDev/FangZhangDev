[profile]
# 主视觉卡片上的大标题，通常写你的名字
title = "Your Name"
subtitle = "Long-term Claude Code + Codex activity, collected locally"
timezone = "Asia/Shanghai"
window_days = 365
# 用于生成 README 里的图片地址；留空则退回仓库内相对路径
repo = "your-name/your-name"
branch = "main"
# 图片走哪个源：
#   jsdelivr = cdn.jsdelivr.net。GitHub 只代理第三方域名的图，所以这个地址会被
#              改写成 camo.githubusercontent.com，浏览器缓存 max-age=691200（8 天）
#   raw      = raw.githubusercontent.com。GitHub 认得是自家域名、原样放行不经 camo，
#              浏览器直连且只缓存 max-age=300（5 分钟），每 5 分钟就要重新回源一次
# 网络到 githubusercontent 不稳时，raw 会表现为「图时有时无」，所以默认 jsdelivr
asset_cdn = "jsdelivr"

[paths]
claude_glob = "~/.claude/projects/**/*.jsonl"
codex_homes = [
  "~/.codex",
  "~/.local/state/agent-config/codex/*",
]
# 会话记录被 cleanupPeriodDays 清掉后，聚合缓存仍留着更早的每日 token
claude_stats_cache = "~/.claude/stats-cache.json"

# 提示日历的数据源。每个工具都有自己的一份，必须全部列出，
# 否则日历会漏掉某个工具的提示数而标题上看不出来。
prompt_histories = [
  { source = "claude-code", glob = "~/.claude/history.jsonl" },
  { source = "codex", glob = "~/.codex/history.jsonl" },
  { source = "codex", glob = "~/.local/state/agent-config/codex/*/history.jsonl" },
]
cache_db = "data/profile.sqlite"
daily_ledger = "data/daily.jsonl"
output_dir = "dist"
readme = "README.md"
