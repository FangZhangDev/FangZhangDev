<svg xmlns="http://www.w3.org/2000/svg" width="435" height="252" viewBox="0 0 435 252" role="img" aria-label="Usage split"><style>text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;dominant-baseline:auto}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.h1{font-size:27px;font-weight:700;fill:#e8eef9;letter-spacing:-.6px}.h2{font-size:14px;font-weight:700;fill:#e8eef9;letter-spacing:-.1px}.eyebrow{font-size:9.5px;font-weight:700;fill:#5f6b80;letter-spacing:2.2px}.sub{font-size:12px;fill:#98a3b8}.kpi{font-size:23px;font-weight:700;fill:#e8eef9;letter-spacing:-.5px}.kpi-s{font-size:15px;font-weight:700;fill:#e8eef9}.lab{font-size:9.5px;font-weight:600;fill:#5f6b80;letter-spacing:1px}.tick{font-size:9.5px;fill:#5f6b80}.val{font-size:11px;font-weight:600;fill:#98a3b8}@keyframes fu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes po{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}@keyframes gw{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes fi{from{opacity:0}to{opacity:1}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.fu{animation:fu .6s cubic-bezier(.22,1,.36,1) both}.po{animation:po .5s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}.gw{animation:gw .9s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:left center}.gy{animation:gy .9s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:bottom center}.fi{animation:fi .5s ease-out both}.cur{animation:blink 1.1s step-end infinite}</style><defs><linearGradient id="sdarkbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d13"/><stop offset="1" stop-color="#131824"/></linearGradient><linearGradient id="sdarkhl" x1="0" x2="1"><stop offset="0" stop-color="#5ce6c4" stop-opacity="0"/><stop offset=".3