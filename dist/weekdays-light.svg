<svg xmlns="http://www.w3.org/2000/svg" width="435" height="252" viewBox="0 0 435 252" role="img" aria-label="Weekday distribution"><style>text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;dominant-baseline:auto}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.h1{font-size:27px;font-weight:700;fill:#0d1424;letter-spacing:-.6px}.h2{font-size:14px;font-weight:700;fill:#0d1424;letter-spacing:-.1px}.eyebrow{font-size:9.5px;font-weight:700;fill:#8994a8;letter-spacing:2.2px}.sub{font-size:12px;fill:#57637a}.kpi{font-size:23px;font-weight:700;fill:#0d1424;letter-spacing:-.5px}.kpi-s{font-size:15px;font-weight:700;fill:#0d1424}.lab{font-size:9.5px;font-weight:600;fill:#8994a8;letter-spacing:1px}.tick{font-size:9.5px;fill:#8994a8}.val{font-size:11px;font-weight:600;fill:#57637a}@keyframes fu{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes po{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}@keyframes gw{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes fi{from{opacity:0}to{opacity:1}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.fu{animation:fu .6s cubic-bezier(.22,1,.36,1) both}.po{animation:po .5s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}.gw{animation:gw .9s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:left center}.gy{animation:gy .9s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:bottom center}.fi{animation:fi .5s ease-out both}.cur{animation:blink 1.1s step-end infinite}</style><defs><linearGradient id="wlightbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f7fb"/></linearGradient><linearGradient id="wlighthl" x1="0" x2="1"><stop offset="0" stop-color="#0f9b86" stop-opacity="0"/><stop offset=".35" stop-color="#0f9b86"/><stop offset=".7" stop-color="#7c5ae0"/><stop offset="1" stop-color="#7c5ae0" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="434" height="251" rx="16" fill="url(#wlightbg)" stroke="#dde4ee"/><rect x="16" y="0" width="403" height="1.5" fill="url(#wlighthl)" opacity=".9"/><g class="fu"><circle cx="27" cy="32.5" r="3" fill="#3f9a45"/><text class="eyebrow" x="37" y="36">WEEKLY SHAPE</text></g><line x1="24" y1="186" x2="411" y2="186" stroke="#e6ebf3"/><g class="fu" style="animation-delay:0.10s"><rect class="gy" style="animation-delay:0.14s" x="37.7" y="114.5" width="34.7" height="71.5" rx="5" fill="#2b7fd4" opacity=".55"/><text class="tick" x="55.1" y="106.5" text-anchor="middle">24%</text><text class="tick" x="55.1" y="202" text-anchor="middle" fill="#57637a">Mon</text></g><g class="fu" style="animation-delay:0.16s"><rect class="gy" style="animation-delay:0.21s" x="91.9" y="146.0" width="34.7" height="40.0" rx="5" fill="#2b7fd4" opacity=".55"/><text class="tick" x="109.2" y="138.0" text-anchor="middle">13%</text><text class="tick" x="109.2" y="202" text-anchor="middle" fill="#57637a">Tue</text></g><g class="fu" style="animation-delay:0.22s"><rect class="gy" style="animation-delay:0.28s" x="146.0" y="106.0" width="34.7" height="80.0" rx="5" fill="#0f9b86" opacity="1"/><text class="tick" x="163.4" y="98.0" text-anchor="middle">27%</text><text class="tick" x="163.4" y="202" text-anchor="middle" fill="#57637a">Wed</text></g><g class="fu" style="animation-delay:0.28s"><rect class="gy" style="animation-delay:0.35s" x="200.2" y="160.7" width="34.7" height="25.3" rx="5" fill="#2b7fd4" opacity=".55"/><text class="tick" x="217.5" y="152.7" text-anchor="middle">8%</text><text class="tick" x="217.5" y="202" text-anchor="middle" fill="#57637a">Thu</text></g><g class="fu" style="animation-delay:0.34s"><rect class="gy" style="animation-delay:0.42s" x="254.3" y="152.7" width="34.7" height="33.3" rx="5" fill="#2b7fd4" opacity=".55"/><text class="tick" x="271.6" y="144.7" text-anchor="middle">11%</text><text class="tick" x="271.6" y="202" text-anchor="middle" fill="#57637a">Fri</text></g><g class="fu" style="animation-delay:0.40s"><rect class="gy" style="animation-delay:0.49s" x="308.5" y="162.6" width="34.7" height="23.4" rx="5" fill="#2b7fd4" opacity=".55"/><text class="tick" x="325.8" y="154.6" text-anchor="middle">8%</text><text class="tick" x="325.8" y="202" text-anchor="middle" fill="#57637a">Sat</text></g><g class="fu" style="animation-delay:0.46s"><rect class="gy" style="animation-delay:0.56s" x="362.6" y="158.8" width="34.7" height="27.2" rx="5" fill="#2b7fd4" opacity=".55"/><text class="tick" x="379.9" y="150.8" text-anchor="middle">9%</text><text class="tick" x="379.9" y="202" text-anchor="middle" fill="#57637a">Sun</text></g><text class="h2" x="24" y="70">Wed is the heaviest day</text><text class="val" x="24" y="88" fill="#8994a8">17% of turns happen on weekends</text><line x1="24" y1="218" x2="411" y2="218" stroke="#e6ebf3"/><text class="tick" x="24" y="236">Share of all turns by weekday</text></svg>